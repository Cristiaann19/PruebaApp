spring.application.name=testing
# Puerto donde correrá tu servidor backend
server.port=8080

# Configuración de la base de datos (Ejemplo para MySQL - Cambia 'taskly_db', tu usuario y contraseña)
spring.datasource.url=jdbc:mysql://localhost:3306/taskly_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456

# Configuración de Hibernate (Actualiza o crea las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
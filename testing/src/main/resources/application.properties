spring.application.name=testing
# Puerto donde correra tu servidor backend
server.port=8080

# Configuracion de la base de datos (Ejemplo para MySQL - Cambia 'taskly_db', tu usuario y contrasena)
spring.datasource.url=jdbc:mysql://localhost:3306/taskly_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456

# Configuracion de Hibernate (Actualiza o crea las tablas automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Documentacion de la API (OpenAPI / Swagger UI)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'testing-app-movil/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'testing-app-movil/**'
      - '.github/workflows/mobile.yml'

defaults:
  run:
    working-directory: testing-app-movil

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: testing-app-movil/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
